<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Approved static fictional service-route diagram</title>
  <desc id="diagram-desc">A fictional floor plan showing an archive room, service corridor covered by Camera 3, maintenance lift, loading dock, front desk, east wing, and a dashed unobserved route from the archive room to the loading dock. This is a diagram, not a photograph.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c8a96e" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#e47b6d"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#080a0d"/>
  <rect width="1200" height="760" fill="url(#grid)"/>

  <g font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace">
    <text x="56" y="58" fill="#c8a96e" font-size="15" letter-spacing="4">AI MYSTERY ROOM · EXHIBIT DIAGRAM</text>
    <text x="56" y="88" fill="#f1e8d8" font-family="Georgia, 'Times New Roman', serif" font-size="30">Service route and sightline</text>
    <text x="56" y="114" fill="#9aa5b1" font-size="13" letter-spacing="1.5">APPROVED STATIC FICTIONAL ASSET · NOT A PHOTOGRAPH · NOT GENERATED FOR THIS CASE</text>
    <rect x="56" y="130" width="1088" height="1" fill="#c8a96e" fill-opacity="0.35"/>
  </g>

  <!-- Building outline -->
  <g fill="#11171e" stroke="#c8a96e" stroke-opacity="0.45" stroke-width="2">
    <rect x="56" y="164" width="1088" height="500"/>
  </g>

  <!-- Public rooms -->
  <g fill="#171f28" stroke="#f1e8d8" stroke-opacity="0.18" stroke-width="1.5">
    <rect x="72" y="180" width="250" height="150"/>
    <rect x="338" y="180" width="270" height="150"/>
    <rect x="624" y="180" width="250" height="150"/>
    <rect x="72" y="346" width="250" height="150"/>
    <rect x="338" y="346" width="270" height="150"/>
  </g>

  <!-- Service corridor -->
  <g fill="#0c1015" stroke="#c8a96e" stroke-opacity="0.55" stroke-width="2">
    <path d="M624 346H950V512H624Z"/>
  </g>

  <!-- Maintenance lift and loading dock -->
  <g fill="#171f28" stroke="#f1e8d8" stroke-opacity="0.18" stroke-width="1.5">
    <rect x="966" y="346" width="162" height="150"/>
    <rect x="762" y="528" width="366" height="120"/>
  </g>

  <!-- Labels -->
  <g font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#f1e8d8">
    <text x="92" y="214">EAST SALON</text>
    <text x="358" y="214">MAIN HALL</text>
    <text x="644" y="214">ARCHIVE ROOM</text>
    <text x="92" y="380">FRONT DESK</text>
    <text x="358" y="380">EAST WING</text>
    <text x="644" y="380" fill="#e8ce9a">SERVICE CORRIDOR</text>
    <text x="984" y="380">MAINTENANCE</text>
    <text x="984" y="400">LIFT</text>
    <text x="782" y="562">LOADING DOCK</text>
  </g>

  <g font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#9aa5b1">
    <text x="92" y="238">18 guests · toast at 19:32</text>
    <text x="358" y="238">public display · 19:30–20:05</text>
    <text x="644" y="238">preview object sealed</text>
    <text x="92" y="404">staffed 19:30–20:00</text>
    <text x="358" y="404">dimmer panel · east circuits</text>
    <text x="644" y="404">Camera 3 covers this route</text>
    <text x="782" y="586">service door L1 · opens 20:09</text>
  </g>

  <!-- Archive room highlight -->
  <rect x="624" y="180" width="250" height="150" fill="#c8a96e" fill-opacity="0.06" stroke="#c8a96e" stroke-opacity="0.8" stroke-width="2"/>
  <text x="644" y="296" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#c8a96e">SCENE OF THE INCIDENT</text>

  <!-- Camera 3 -->
  <g transform="translate(704 330)">
    <rect x="-10" y="-12" width="20" height="16" rx="2" fill="#0c1015" stroke="#e8ce9a" stroke-width="1.5"/>
    <path d="M10 -7 20 -11V7L10 3Z" fill="#0c1015" stroke="#e8ce9a" stroke-width="1.5"/>
    <path d="M-2 -12V-20" stroke="#e8ce9a" stroke-width="1.5"/>
    <text x="26" y="4" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#e8ce9a">CAM 3 · 94-SECOND LOOP 19:46</text>
  </g>

  <!-- Service panel -->
  <g>
    <rect x="836" y="470" width="18" height="26" fill="#0c1015" stroke="#c8a96e" stroke-width="1.5"/>
    <text x="862" y="490" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#c8a96e">PANEL G4 · 19:44</text>
  </g>

  <!-- Blind-spot route -->
  <path d="M748 330V420H870V520H910V588H770" fill="none" stroke="#e47b6d" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <g font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#e47b6d">
    <text x="876" y="444">UNOBSERVED WHILE CAMERA 3 LOOPS</text>
    <text x="876" y="462">route does not identify a person</text>
  </g>

  <!-- Time markers -->
  <g font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#9aa5b1">
    <text x="72" y="700">19:44 panel load</text>
    <text x="270" y="700">19:48 corridor unlock</text>
    <text x="486" y="700">19:52 lift call</text>
    <text x="664" y="700">20:09 loading dock opens</text>
    <text x="908" y="700">20:10 dock closes</text>
  </g>
  <rect x="72" y="686" width="1056" height="1" fill="#f1e8d8" fill-opacity="0.12"/>
  <g font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#9aa5b1">
    <text x="56" y="728">FICTIONAL DIAGRAM · Times are illustrative puzzle records, not real surveillance · No real people or locations are depicted</text>
  </g>
</svg>
